<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Ítaca Bootcamps</title>
<meta name="theme-color" content="#3B1F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ítaca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4EFE7; --panel:#FFFDF9; --panel2:#EFE8DD; --ink:#1D1B2B; --muted:#6E6861; --faint:#A39B91;
  --line:#E3DACD; --line2:#D3C8B8;
  --accent:#C0603E; --accent-ink:#A34E30; --accent-wash:#F4E1D6; --brown:#3B1F17; --on-brown:#F6EDE6;
  --ok:#3D7A4F; --ok-wash:rgba(61,122,79,.1);
  --warn:#AE7015; --warn-wash:rgba(196,133,24,.12);
  --bad:#B3402F; --bad-wash:rgba(179,64,47,.09);
  --scrim:rgba(29,20,15,.5);
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#16110F; --panel:#201915; --panel2:#2A211C; --ink:#F2EBE3; --muted:#B3A89C; --faint:#7E7368;
    --line:#382C25; --line2:#4A3B32;
    --accent:#E07E5A; --accent-ink:#EE9B7B; --accent-wash:rgba(224,126,90,.15); --brown:#2E1A13; --on-brown:#F6EDE6;
    --ok:#7CC293; --ok-wash:rgba(124,194,147,.12);
    --warn:#E2B060; --warn-wash:rgba(226,176,96,.13);
    --bad:#EE8472; --bad-wash:rgba(238,132,114,.12);
    --scrim:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
@media (max-width:520px){.wrap{padding-inline:16px}}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}

.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:26px 18px;border-bottom:1px solid var(--line)}
.brand .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.wordmark{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em}
.me{font-size:13px;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;padding-block:28px 6px}
h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin:8px 0 6px;letter-spacing:-.01em}
.today{color:var(--muted);font-size:15px}
.savechip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:5px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.savechip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip[data-s="saving"]::before,.savechip[data-s="dirty"]::before{background:var(--warn)}
.savechip[data-s="error"]::before,.savechip[data-s="ro"]::before{background:var(--bad)}
.rule{margin:14px 0 0;color:var(--muted);font-size:14.5px;max-width:80ch}
.rule b{color:var(--ink);font-weight:600}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-top:22px;border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;padding:12px 12px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab.add{color:var(--accent-ink);font-weight:600;margin-left:auto}

main{padding-block:30px 70px}
section + section{margin-top:40px}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;margin-bottom:14px}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0}
.sh p{margin:0;color:var(--muted);font-size:14px}
.banner{background:var(--warn-wash);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:20px}

.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.next{grid-template-columns:1fr}}
.nx{appearance:none;text-align:left;cursor:pointer;display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.nx:hover{border-color:var(--line2);background:var(--panel2)}
.nx .cal{flex:none;width:58px;text-align:center;border-radius:9px;background:var(--panel2);padding:7px 0 6px}
.nx .cal .d{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1}
.nx .cal .m{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.nx.first{background:var(--brown);border-color:var(--brown);color:var(--on-brown)}
.nx.first:hover{background:var(--brown);filter:brightness(1.1)}
.nx.first .cal{background:rgba(255,255,255,.1)}
.nx.first .cal .m,.nx.first .who{color:rgba(246,237,230,.72)}
.nx .what{font-weight:600;font-size:16px;line-height:1.3}
.nx .who{color:var(--muted);font-size:14px}
.when{font-weight:600;font-size:13.5px}
.when.bad{color:var(--bad)} .when.warn{color:var(--warn)} .when.ok{color:var(--ok)} .when.mut{color:var(--muted)}
.nx.first .when{color:#F2B79E}

.board{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:20px 22px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.co{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.co .n{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2}
.co:hover .n{color:var(--accent-ink)}
.co .s{font-size:13.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.step{padding-right:8px;display:flex;flex-direction:column;gap:2px}
.step .top{display:flex;align-items:center}
.step .top::after{content:"";flex:1;height:2px;background:var(--line);margin-left:8px}
.step:last-child .top::after{display:none}
.step.done .top::after{background:var(--ok)}
.tick{appearance:none;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0;color:transparent;font-size:13px;line-height:1;font-weight:700}
.tick:hover:not(:disabled){border-color:var(--ok);color:var(--ok)}
.tick:disabled{cursor:default}
.step.bad .tick,.vt li.bad .tick{border-color:var(--bad)}
.step.warn .tick,.vt li.warn .tick{border-color:var(--warn)}
.step.done .tick,.vt li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.boot{background:var(--accent);border-color:var(--accent);cursor:default;color:#fff;font-size:11.5px}
.step .lab{font-size:11px;letter-spacing:.05em;line-height:1.3;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px}
.step .dd{font-weight:600;font-size:15.5px}
.step.done .dd{color:var(--muted)}
@media (max-width:860px){
  .row{grid-template-columns:1fr;gap:14px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}
  .step:nth-child(2n) .top::after{display:none}
}

.tbd{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tb{appearance:none;text-align:left;cursor:pointer;background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tb:hover{background:var(--panel2)}
.tb .n{font-family:var(--serif);font-size:19px;font-weight:600}
.tb .s{font-size:13.5px;color:var(--muted)}
.tb .kk{font-size:13px;color:var(--muted);font-weight:600}
.tb .kk.ok{color:var(--ok)}
.enc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent-ink);margin-top:3px}
.enc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.enc.none{color:var(--faint);font-weight:500}
.enc.none::before{background:var(--line2)}
.encl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.tb .go{margin-top:6px;font-size:13.5px;color:var(--accent-ink);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.empty{padding:22px;color:var(--muted);text-align:center}

.back{appearance:none;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:16px}
.back:hover{color:var(--ink)}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}
.dh h2{font-size:34px;line-height:1.1}
.dh .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.info{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;color:var(--muted);font-size:14.5px}
.info b{color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:26px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 14px}
.vt{list-style:none;margin:0;padding:0}
.vt li{display:grid;grid-template-columns:26px 1fr;gap:14px;position:relative;padding-bottom:22px}
.vt li:last-child{padding-bottom:0}
.vt li::before{content:"";position:absolute;left:12px;top:30px;bottom:2px;width:2px;background:var(--line)}
.vt li:last-child::before{display:none}
.vt li.done::before{background:var(--ok)}
.vt .t1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.vt .nm{font-weight:600;font-size:16px}
.vt .rl{font-size:12.5px;color:var(--faint);font-weight:600}
.vt .ds{font-size:14px;color:var(--muted);margin:2px 0 6px}
.vt .dt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.vt .dt .d{font-weight:600}
.adj{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.sess{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ses{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ses .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.ses .d{font-weight:600}
.ses .h{font-size:13.5px;color:var(--muted)}
.ses .fest{font-size:12.5px;color:var(--warn);font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px}

.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);padding:8px 15px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:var(--on-brown)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.primary:disabled{opacity:.6;cursor:default}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=password],select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:14.5px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
select.inline{width:auto;padding:6px 10px;font-size:14px}

.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) 16px 28px;overflow-y:auto}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:640px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mh{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh h3{margin:0;font-family:var(--serif);font-size:23px;font-weight:600}
.mb{padding:18px 24px;display:flex;flex-direction:column;gap:16px}
.mf{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
@media (max-width:560px){.fg{grid-template-columns:1fr}}
.fs{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin:6px 0 -6px}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.srow{display:grid;grid-template-columns:34px 1.5fr 1fr 1fr 30px;gap:8px;align-items:center}
.srow .n{font-size:12.5px;color:var(--muted);font-weight:600}
@media (max-width:560px){.srow{grid-template-columns:1.4fr 1fr 1fr 30px}.srow .n{display:none}}
.x{appearance:none;border:0;background:none;color:var(--faint);cursor:pointer;font-size:19px;line-height:1;padding:4px;border-radius:6px}
.x:hover{color:var(--bad)}
.err{color:var(--bad);font-size:14px}
.adj input[type=date]{width:auto;padding:3px 8px;font-size:13px}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.login{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.login form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.login h2{font-size:26px}
.login p{margin:0;color:var(--muted);font-size:14.5px}
.login code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:13px}

.navin{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.navin .tabs-in{flex:1;min-width:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.tools input[type=search]{width:220px;padding:6px 10px;font-size:14px;background:var(--panel);border:1px solid var(--line2);border-radius:8px}
.tools select{width:auto;padding:6px 10px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:34px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left}
.kpi .kv{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.kpi .kl{font-size:13px;color:var(--muted)}
.kpi .kn{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.kpi.bad .kv{color:var(--bad)}
.kpi.go{appearance:none;cursor:pointer;background:var(--brown);border-color:var(--brown);color:var(--on-brown)}
.kpi.go .kl{color:rgba(246,237,230,.72)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.go{grid-column:1/-1}}
.yh{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;font-family:var(--serif);font-size:18px;font-weight:600}
.yh .yc,.fold .yc{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500}
.yh.bad{color:var(--bad)}
.bhead,.brow{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center;padding:14px 20px}
.bhead{padding-block:10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brow{border-top:1px solid var(--line)}
.bhead + .brow{border-top:0}
.brow:hover{background:var(--panel2)}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;text-align:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell .cl{display:none;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cell .cd{font-size:12.5px;font-weight:600;color:var(--ink);min-height:1em}
.cell.done .cd{color:var(--faint)}
.cell .cs{font-size:11.5px;font-weight:600}
.cs.bad{color:var(--bad)} .cs.warn{color:var(--warn)} .cs.mut{color:var(--muted)}
.cell.bad .tick{border-color:var(--bad)} .cell.warn .tick{border-color:var(--warn)}
.cell.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.co .meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.co .meta .enc{margin-top:0}
.prog{display:inline-block;width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog.lg{width:180px;height:8px}
.pn{font-size:12.5px;color:var(--muted);font-weight:600}
.dprog{display:flex;align-items:center;gap:10px;margin-top:12px}
.info a{color:var(--accent-ink);text-decoration:none}
.info a:hover{text-decoration:underline}
.tbh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tb .dots{display:flex;align-items:center;gap:4px;margin-top:6px}
.tb .dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2)}
.tb .dots i.on{background:var(--ok);border-color:var(--ok)}
.tb .dots .pn{margin-left:6px}
.tb .s b{color:var(--ink);font-weight:600}
.tb .nt{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2::before{content:"▸ ";color:var(--muted);font-size:16px}
.fold[open] summary h2::before{content:"▾ "}
.fold.how .rule{margin:0 0 10px}
.agl{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ag{appearance:none;background:none;border:0;border-top:1px solid var(--line);width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:11px 16px;text-align:left;cursor:pointer}
.ag:first-child{border-top:0}
.ag:hover{background:var(--panel2)}
.agd{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.agd b{font-family:var(--serif);font-size:21px}
.agd span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.agw{display:flex;flex-direction:column}
.agw .what{font-weight:600}
.agw .who{font-size:13.5px;color:var(--muted)}
.ag.boot .agd b{color:var(--accent)}
@media (max-width:900px){
  .bhead{display:none}
  .brow{grid-template-columns:1fr;gap:12px}
  .cells{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}
  .cell .cl{display:block}
  .tools{width:100%}
  .tools input[type=search]{flex:1;width:auto;min-width:140px}
}

<body>
<div class="wrap">
  <div class="brand"><span class="wordmark">Homeland</span><span class="r"><span class="eyebrow">Programa Ítaca · Control de ejecución</span><span class="me" id="me" hidden></span><button class="btn sm" id="install" data-act="install" hidden>Instalar app</button><button class="btn sm" id="logout" data-act="logout" hidden>Salir</button></span></div>
  <div id="hero" hidden>
    <div class="hero">
      <div>
        <div class="eyebrow">Programa Ítaca</div>
        <h1>Dashboard Ítaca Bootcamps</h1>
        <div class="today" id="today"></div>
      </div>
      <div class="savechip" id="savechip" data-s="ok" hidden></div>
    </div>
  </div>
</div>
<nav class="tabs" id="nav" aria-label="Vistas" hidden><div class="wrap navin"><div class="tabs-in" id="tabs" role="tablist"></div>
  <div class="tools" id="tools"><input type="search" id="q" placeholder="Buscar empresa o contacto" aria-label="Buscar"><select id="fenc" aria-label="Filtrar por encargado"></select><button class="btn sm" data-act="csv" title="Descargar la lista en Excel (CSV)">Exportar</button><button class="btn sm primary" id="btnNew" data-act="new">+ Nuevo bootcamp</button></div>
</div></nav>
<main class="wrap" id="main"></main>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const CFG=window.ITACA_CONFIG||{};
const OFF={datos:28,modelos:14};
const HITOS=[
  {k:'pitch',s:'Pitch',label:'Reunión de pitch',rule:'Sin fecha límite',desc:'Se le presentó Ítaca a la empresa.',opt:true},
  {k:'oferta',s:'Oferta',label:'Oferta comercial enviada',rule:'Sin fecha límite',desc:'La empresa recibió la oferta comercial.',opt:true},
  {k:'nda',s:'NDA',label:'NDA firmado',rule:'Sin fecha límite',desc:'Las dos partes firmaron el acuerdo de confidencialidad.',opt:true},
  {k:'wishlist',s:'Wishlist',label:'Wishlist generado',rule:'Sin fecha límite',desc:'Se le envió a la empresa la lista de datos que necesitamos.',opt:true},
  {k:'kickoff',s:'Kick-off',label:'Kick-off',rule:'Sin fecha límite',desc:'Reunión de arranque con el equipo de la empresa.',opt:true},
  {k:'datos',s:'Datos',label:'Datos recolectados',rule:'4 semanas antes',desc:'La empresa entregó la totalidad de los datos.'},
  {k:'modelos',s:'Modelos',label:'Modelos listos',rule:'2 semanas antes',desc:'Los modelos y el material para el bootcamp están terminados.'}
];
const EST=[['confirmado','Confirmado'],['por-confirmar','Por confirmar'],['finalizado','Finalizado']];
const MOD=['Presencial','Virtual'];
const ENC=['Rafael','Cipriano','Ambar'];
const FESTIVOS={'2026-10-12':'Día de la Raza','2026-11-02':'Todos los Santos','2026-11-16':'Independencia de Cartagena','2026-12-08':'Inmaculada Concepción','2026-12-25':'Navidad','2027-01-01':'Año Nuevo','2027-01-11':'Reyes Magos','2027-03-22':'San José','2027-03-25':'Jueves Santo','2027-03-26':'Viernes Santo'};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const DIAL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const dn=s=>{ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const dt=n=>new Date(n*864e5);
const iso=n=>{ const d=dt(n); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); };
const dayNow=()=>{ const n=new Date(); return Math.round(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5); };
let TODAY=dayNow();
const fS=n=>{ const d=dt(n); return DIA[d.getUTCDay()]+' '+d.getUTCDate()+' '+MES[d.getUTCMonth()]; };
const fL=n=>{ const d=dt(n); return DIAL[d.getUTCDay()]+' '+d.getUTCDate()+' de '+MESL[d.getUTCMonth()]; };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const encSel=(v,id,dis)=>'<select class="inline" id="'+id+'" data-act="enc" aria-label="Encargado"'+(dis||'')+'><option value=""'+(v?'':' selected')+'>Sin encargado</option>'+ENC.map(e=>'<option'+(v===e?' selected':'')+'>'+e+'</option>').join('')+'</select>';
const encTxt=b=>b.encargado?'<span class="enc">'+esc(b.encargado)+'</span>':'<span class="enc none">Sin encargado</span>';

let sb=null, USER=null, S=null, RO=false, saved={}, pendingRender=false, started=false;
let ui={tab:'resumen',view:'tablero',q:'',enc:'',modal:null};
try{ const t=localStorage.getItem('itaca-tab'); if(t) ui.tab=t; const v=localStorage.getItem('itaca-view'); if(v) ui.view=v; ui.enc=localStorage.getItem('itaca-enc')||''; }catch(e){}

const find=id=>S.bootcamps.find(b=>b.id===id);
const ses=b=>(b.sesiones||[]).filter(s=>s.fecha).map(s=>({...s,n:dn(s.fecha)})).sort((a,c)=>a.n-c.n);
const start=b=>{ const s=ses(b); return s.length?s[0].n:null; };
const end=b=>{ const s=ses(b); return s.length?s[s.length-1].n:null; };
const hd=(b,k)=>{ const h=b.hitos[k]; if(h.fecha) return dn(h.fecha); if(!(k in OFF)) return null; const s=start(b); return s==null?null:s-OFF[k]; };
const isOpt=k=>!(k in OFF);
function st(b,k){
  const h=b.hitos[k], d=hd(b,k);
  if(h.hecho) return {c:'done',w:'ok',t:'Listo'};
  if(d==null) return {c:'',w:'mut',t:isOpt(k)?'Pendiente':'Sin fecha'};
  const x=d-TODAY;
  if(isOpt(k)) return {c:'',w:'mut',t:x>0?'En '+x+' días':(x===0?'Hoy':'Pendiente de marcar')};
  if(x<0) return {c:'bad',w:'bad',t:'Atrasado '+(-x)+(x===-1?' día':' días')};
  if(x===0) return {c:'warn',w:'warn',t:'Vence hoy'};
  if(x<=7) return {c:'warn',w:'warn',t:'Esta semana · en '+x+(x===1?' día':' días')};
  return {c:'',w:'mut',t:'Faltan '+x+' días'};
}
function rangeTxt(b){
  const s=ses(b); if(!s.length) return 'Fechas por definir';
  const a=dt(s[0].n), z=dt(s[s.length-1].n);
  return a.getUTCMonth()===z.getUTCMonth() ? a.getUTCDate()+' al '+z.getUTCDate()+' de '+MESL[a.getUTCMonth()] : a.getUTCDate()+' de '+MESL[a.getUTCMonth()]+' al '+z.getUTCDate()+' de '+MESL[z.getUTCMonth()];
}
const inDays=x=>x===0?'Hoy':(x===1?'Mañana':(x>0?'Faltan '+x+' días':'Hace '+(-x)+' días'));
const estL=e=>(EST.find(x=>x[0]===e)||[0,e])[1];
const shortName=email=>{ const n=String(email||'').split('@')[0].split(/[._-]/)[0]; return n?n.charAt(0).toUpperCase()+n.slice(1):''; };

/* ---------- guardado ---------- */
let timer=null, saving=false, again=false, chipT=null;
function chip(s,t,hide){ const c=$('savechip'); clearTimeout(chipT); c.dataset.s=s; c.textContent=t; c.hidden=!!hide; if(s==='ok'&&t==='Guardado') chipT=setTimeout(()=>{c.hidden=true;},2500); }
const body=b=>{ const o=JSON.parse(JSON.stringify(b)); delete o.actualizado; delete o.actualizado_por; delete o.id; return o; };
const key=b=>JSON.stringify(body(b));
function stamp(){ let m=null,p=''; Object.values(saved).forEach(v=>{ if(v.t&&(!m||v.t>m)){ m=v.t; p=v.p||''; } }); S.actualizado=m; S.por=p; }
function commit(){
  render();
  if(RO) return;
  chip('dirty','Cambios sin guardar'); clearTimeout(timer); timer=setTimeout(save,700);
}
async function save(){
  if(saving){ again=true; return; }
  saving=true; chip('saving','Guardando…');
  try{
    const now=new Date().toISOString(), ids=new Set(), me=USER&&USER.email||'';
    for(const b of S.bootcamps){
      ids.add(b.id); const k=key(b);
      if(saved[b.id]&&saved[b.id].k===k) continue;
      const {error}=await sb.from('bootcamps').upsert({id:b.id,data:{...body(b),actualizado_por:me},actualizado:now});
      if(error) throw error;
      saved[b.id]={k,t:now,p:me};
    }
    for(const id of Object.keys(saved)){
      if(!ids.has(id)){ const {error}=await sb.from('bootcamps').delete().eq('id',id); if(error) throw error; delete saved[id]; }
    }
    stamp(); chip('ok','Guardado'); safeRender();
  }catch(e){
    const c=e&&(e.code||e.status);
    if(c==='42501'||c===401||c===403){ RO=true; chip('ro','Sin permiso para editar'); render(); }
    else { chip('dirty','Sin conexión · reintentando…'); clearTimeout(timer); timer=setTimeout(save,2500+Math.random()*1500); }
  }
  saving=false; if(again){ again=false; save(); }
}
function busy(){ const a=document.activeElement; return !!ui.modal||!!(a&&a.closest&&a.closest('#main')&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)); }
function safeRender(){ if(busy()){ pendingRender=true; return; } pendingRender=false; render(); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(pendingRender&&!busy()) safeRender(); },0));

/* ---------- vistas ---------- */
function sorted(){ return S.bootcamps.slice().sort((a,b)=>{ const x=start(a),y=start(b); if(x==null&&y==null) return a.empresa.localeCompare(b.empresa,'es'); if(x==null) return 1; if(y==null) return -1; return x-y; }); }
const norm2=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function visible(){
  const q=norm2(ui.q);
  return sorted().filter(b=>(!q||norm2(b.empresa+' '+b.ciudad+' '+(b.contacto||{}).nombre).includes(q))&&(!ui.enc||(ui.enc==='-'?!b.encargado:b.encargado===ui.enc)));
}
const isPast=b=>{ const z=end(b); return z!=null&&z<TODAY; };
const isDone=b=>b.estado==='finalizado'||isPast(b);
const nDone=b=>HITOS.filter(h=>b.hitos[h.k].hecho).length;
function nextStep(b){ const h=HITOS.find(h=>!b.hitos[h.k].hecho); return h?{h,s:st(b,h.k),d:hd(b,h.k)}:null; }
function lateCount(list){ let n=0; list.forEach(b=>{ if(start(b)==null) return; HITOS.forEach(h=>{ if(st(b,h.k).c==='bad') n++; }); }); return n; }
const fD=n=>{ const d=dt(n); return d.getUTCDate()+' '+MES[d.getUTCMonth()]; };
const plural=(n,a,b)=>n+' '+(n===1?a:b);

function renderTabs(){
  let t='<button class="tab" data-act="view" data-id="tablero" aria-selected="'+(ui.tab==='resumen'&&ui.view==='tablero')+'">Tablero</button>';
  t+='<button class="tab" data-act="view" data-id="agenda" aria-selected="'+(ui.tab==='resumen'&&ui.view==='agenda')+'">Agenda</button>';
  if(ui.tab!=='resumen'){ const b=find(ui.tab); if(b) t+='<button class="tab" aria-selected="true">'+esc(b.empresa)+'</button>'; }
  $('tabs').innerHTML=t;
  $('tools').hidden=ui.tab!=='resumen';
  $('btnNew').hidden=RO;
  const sel=$('fenc'); const cur=ui.enc||'';
  sel.innerHTML='<option value="">Todos los encargados</option>'+ENC.map(e=>'<option'+(cur===e?' selected':'')+'>'+e+'</option>').join('')+'<option value="-"'+(cur==='-'?' selected':'')+'>Sin encargado</option>';
}
function render(){
  const _t=fL(TODAY)+' de '+dt(TODAY).getUTCFullYear(); $('today').textContent=_t.charAt(0).toUpperCase()+_t.slice(1);
  if(ui.tab!=='resumen'&&!find(ui.tab)) ui.tab='resumen';
  renderTabs();
  const when=S.actualizado?new Date(S.actualizado).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
  const body=ui.tab!=='resumen'?vOne(find(ui.tab)):(ui.view==='agenda'?vAgenda():vAll());
  $('main').innerHTML=(RO?'<div class="banner">Tu cuenta no tiene permiso para editar. Pídele a Rafael que revise tu usuario.</div>':'')+body+
    '<footer><span>Homeland Consulting S.A.S. · Programa Ítaca</span><span>'+(when?'Último cambio '+when+(S.por?' · '+esc(shortName(S.por)):''):'')+'</span></footer>';
  renderModal();
}

function kpis(list){
  const act=list.filter(b=>!isDone(b));
  const conf=act.filter(b=>b.estado==='confirmado'), pc=act.filter(b=>b.estado==='por-confirmar');
  const next=conf.filter(b=>start(b)!=null&&start(b)>=TODAY).sort((a,b)=>start(a)-start(b))[0];
  const late=lateCount(conf);
  const in30=conf.filter(b=>{ const s=start(b); return s!=null&&s>=TODAY&&s-TODAY<=30; }).length;
  return '<div class="kpis">'+
    '<div class="kpi"><span class="kv num">'+conf.length+'</span><span class="kl">Confirmados</span></div>'+
    '<div class="kpi"><span class="kv num">'+pc.length+'</span><span class="kl">Por confirmar</span></div>'+
    '<div class="kpi"><span class="kv num">'+in30+'</span><span class="kl">Bootcamps en los próximos 30 días</span></div>'+
    '<div class="kpi'+(late?' bad':'')+'"><span class="kv num">'+late+'</span><span class="kl">'+(late===1?'Paso atrasado':'Pasos atrasados')+'</span></div>'+
    (next?'<button class="kpi go" data-act="tab" data-id="'+esc(next.id)+'"><span class="kl">Próximo bootcamp</span><span class="kn">'+esc(next.empresa)+'</span><span class="kl">'+esc(fL(start(next)))+' · '+inDays(start(next)-TODAY).toLowerCase()+'</span></button>':'')+
  '</div>';
}
function nextCards(list){
  const ev=[];
  list.filter(b=>!isDone(b)&&b.estado==='confirmado'&&start(b)!=null).forEach(b=>{ HITOS.forEach(h=>{ if(!h.opt&&!b.hitos[h.k].hecho) ev.push({b,label:h.label,d:hd(b,h.k),s:st(b,h.k)}); }); const s0=start(b); if(s0>=TODAY) ev.push({b,label:'Inicia el bootcamp',d:s0,s:{w:'mut',t:inDays(s0-TODAY)}}); });
  ev.sort((a,c)=>a.d-c.d);
  let h='<section><div class="sh"><h2>Lo próximo</h2><p>Las fechas más cercanas que aún no se han cumplido.</p></div>';
  if(!ev.length) return h+'<div class="board empty">No hay fechas pendientes.</div></section>';
  h+='<div class="next">'; ev.slice(0,3).forEach((e,i)=>{ const d=dt(e.d); h+='<button class="nx'+(i===0?' first':'')+'" data-act="tab" data-id="'+esc(e.b.id)+'"><div class="cal"><div class="d num">'+d.getUTCDate()+'</div><div class="m">'+MES[d.getUTCMonth()]+'</div></div><div><div class="what">'+esc(e.label)+'</div><div class="who">'+esc(e.b.empresa)+' · '+DIAL[d.getUTCDay()]+'</div><div class="when '+e.s.w+'">'+esc(e.s.t)+'</div></div></button>'; });
  return h+'</div></section>';
}
function rowHtml(b){
  const s0=start(b), n=nDone(b), dis=RO?' disabled':'';
  let h='<div class="brow"><button class="co" data-act="tab" data-id="'+esc(b.id)+'"><span class="n">'+esc(b.empresa)+'</span><span class="s">'+esc(rangeTxt(b))+' · '+esc(b.ciudad||b.modalidad)+'</span><span class="meta">'+encTxt(b)+'<span class="prog" title="'+n+' de '+HITOS.length+' pasos"><i style="width:'+Math.round(n/HITOS.length*100)+'%"></i></span><span class="pn num">'+n+'/'+HITOS.length+'</span></span></button><div class="cells">';
  HITOS.forEach(x=>{ const q=st(b,x.k), d=hd(b,x.k), done=b.hitos[x.k].hecho;
    h+='<div class="cell '+q.c+'" title="'+esc(x.label+(d!=null?' · '+fL(d):''))+'"><span class="cl">'+x.s+'</span><button class="tick" data-act="tick" data-id="'+esc(b.id)+'" data-k="'+x.k+'" aria-pressed="'+done+'" aria-label="Marcar '+esc(x.label)+' de '+esc(b.empresa)+'"'+dis+'>✓</button>'+
      '<span class="cd">'+(d!=null?fD(d):'')+'</span>'+(!done&&(q.c==='bad'||q.c==='warn')?'<span class="cs '+q.w+'">'+(q.c==='bad'?'Atrasado':(d===TODAY?'Hoy':'En '+(d-TODAY)+' d'))+'</span>':'')+'</div>'; });
  h+='<div class="cell"><span class="cl">Bootcamp</span><span class="tick boot" aria-hidden="true">D</span><span class="cd">'+(s0!=null?fD(s0):'')+'</span><span class="cs mut">'+(s0==null?'':(s0>=TODAY?inDays(s0-TODAY):(TODAY<=end(b)?'En curso':'Realizado')))+'</span></div>';
  return h+'</div></div>';
}
function boardHtml(list){
  let h='<div class="board"><div class="bhead"><span></span><div class="cells">'+HITOS.map(x=>'<span title="'+esc(x.label+' · '+x.rule)+'">'+x.s+'</span>').join('')+'<span>Bootcamp</span></div></div>';
  list.forEach(b=>h+=rowHtml(b));
  return h+'</div>';
}
function cardHtml(b){
  const ns=nextStep(b), s0=start(b);
  return '<button class="tb" data-act="tab" data-id="'+esc(b.id)+'"><span class="tbh"><span class="n">'+esc(b.empresa)+'</span>'+(b.estado==='por-confirmar'?'<span class="pill">Por confirmar</span>':'')+'</span>'+encTxt(b)+
    '<span class="s">'+esc(s0!=null?rangeTxt(b):'Fechas por definir')+(b.ciudad?' · '+esc(b.ciudad):'')+'</span>'+
    '<span class="dots">'+HITOS.map(h=>'<i class="'+(b.hitos[h.k].hecho?'on':'')+'" title="'+esc(h.label)+'"></i>').join('')+'<span class="pn num">'+nDone(b)+'/'+HITOS.length+'</span></span>'+
    (ns?'<span class="s">Sigue: <b>'+esc(ns.h.label)+'</b></span>':'<span class="s">Todos los pasos listos</span>')+
    (b.nota?'<span class="nt">'+esc(b.nota)+'</span>':'')+'</button>';
}
function vAll(){
  const list=visible();
  const act=list.filter(b=>!isDone(b)), done=list.filter(isDone);
  const conf=act.filter(b=>b.estado==='confirmado'), pc=act.filter(b=>b.estado==='por-confirmar');
  const dated=conf.filter(b=>start(b)!=null), nodate=conf.filter(b=>start(b)==null);

function norm(b){
  const hs={}; HITOS.forEach(h=>{ const o=(b.hitos||{})[h.k]||{}; hs[h.k]={hecho:!!o.hecho,fecha:o.fecha||null}; });
  return {id:b.id,empresa:b.empresa||'',ciudad:b.ciudad||'',estado:['confirmado','por-confirmar','finalizado'].includes(b.estado)?b.estado:'confirmado',modalidad:b.modalidad==='Virtual'?'Virtual':'Presencial',lugar:b.lugar||'',encargado:ENC.includes(b.encargado)?b.encargado:'',contacto:{nombre:(b.contacto||{}).nombre||'',email:(b.contacto||{}).email||'',tel:(b.contacto||{}).tel||''},sesiones:Array.isArray(b.sesiones)?b.sesiones:[],hitos:hs,nota:typeof b.nota==='string'?b.nota:''};
}
let first=true;
function apply(rows){
  const local={}; S.bootcamps.forEach(b=>local[b.id]=b);
  const next={}, prev=new Set(Object.keys(saved)), seen=new Set();
  rows.forEach(r=>{
    seen.add(r.id);
    const raw=r.data||{}; const b=norm({...raw,id:r.id}); const k=key(b);
    const mine=local[r.id];
    if(!first&&!mine&&saved[r.id]){ saved[r.id]={k,t:r.actualizado,p:raw.actualizado_por}; return; } // lo borré aquí y falta guardar
    if(mine&&saved[r.id]&&key(mine)!==saved[r.id].k&&!first) next[r.id]=mine; // cambios míos sin guardar
    else next[r.id]=b;
    saved[r.id]={k,t:r.actualizado,p:raw.actualizado_por};
  });
  Object.keys(saved).forEach(id=>{ if(!seen.has(id)) delete saved[id]; });
  S.bootcamps.forEach(b=>{ if(!next[b.id]&&!prev.has(b.id)&&!first) next[b.id]=b; }); // creado aquí, sin guardar todavía
  S.bootcamps=Object.values(next); stamp();
  if(first){ first=false; render(); } else safeRender();
}
let fetching=false, refetchAgain=false, rT=null;
async function refetch(){
  if(fetching){ refetchAgain=true; return; }
  fetching=true;
  try{
    const {data,error}=await sb.from('bootcamps').select('id,data,actualizado');
    if(error) throw error;
    apply(data);
    if($('savechip').dataset.s==='error') chip('ok','',true);
  }catch(e){
    if(first){ $('main').innerHTML='<div class="banner">No se pudieron cargar los bootcamps. Revisa tu conexión y vuelve a abrir la app.</div>'; }
    else chip('error','Sin conexión');
  }
  fetching=false; if(refetchAgain){ refetchAgain=false; refetch(); }
}

  if(started) return; started=true; document.body.classList.remove('is-login');
  $('hero').hidden=false; $('nav').hidden=false; $('logout').hidden=false;
  const me=$('me'); me.textContent=USER.email; me.hidden=false;
  S={bootcamps:[],actualizado:null};
  $('main').innerHTML='<div class="empty">Cargando…</div>';
  const ok=await canWrite();
  if(!ok){ RO=true; }
  await refetch();
  if(RO&&!S.bootcamps.length){ $('main').innerHTML='<div class="banner">Tu correo ('+esc(USER.email)+') no está en la lista del equipo. Pídele a Rafael que lo agregue.</div>'; return; }
  sb.channel('bootcamps').on('postgres_changes',{event:'*',schema:'public',table:'bootcamps'},soon).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ const d=dayNow(); if(d!==TODAY){ TODAY=d; } soon(); } });
  window.addEventListener('online',soon);
  setInterval(()=>{ const d=dayNow(); if(d!==TODAY){ TODAY=d; safeRender(); } },60000);
}

/* ---------- login ---------- */
let loginMode='in';
const pwField=(id,label,ac)=>'<label class="f">'+label+'<span class="pw"><input type="password" id="'+id+'" autocomplete="'+ac+'" required minlength="8"><button type="button" class="eye" data-act="eye" data-for="'+id+'" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>';
function showLogin(msg,email,ok){
  $('hero').hidden=true; $('nav').hidden=true; $('logout').hidden=true; $('me').hidden=true; document.body.classList.add('is-login');
  const first=loginMode==='new';
  $('main').innerHTML='<div class="auth"><div class="auth-brand"><div class="ab-top"><span class="wordmark">Homeland</span><span class="ab-mark" aria-hidden="true">Í</span></div>'+
    '<div class="ab-mid"><div class="ab-eyebrow">Programa Ítaca</div><h1>Dashboard Ítaca Bootcamps</h1><p>Fechas, pasos y responsables de cada bootcamp, al día para todo el equipo.</p></div>'+
    '<ul class="ab-list"><li><span></span>Pitch, oferta, NDA y wishlist</li><li><span></span>Kick-off, datos y modelos</li><li><span></span>Bootcamps 2026 y 2027</li></ul></div>'+
    '<div class="auth-form"><form data-form="login" autocomplete="on" novalidate>'+
    '<div class="seg" role="tablist"><button type="button" role="tab" data-act="lmode" data-id="in" aria-selected="'+!first+'">Entrar</button><button type="button" role="tab" data-act="lmode" data-id="new" aria-selected="'+first+'">Primera vez</button></div>'+
    '<h2>'+(first?'Crea tu contraseña':'Bienvenido')+'</h2>'+
    (first?'<p class="hint">Solo para correos del equipo.</p>':'')+
    '<label class="f">Correo<input type="email" id="lg-email" autocomplete="username" required placeholder="nombre@homeland.net.co" value="'+esc(email||'')+'"></label>'+
    pwField('lg-pass',first?'Contraseña nueva':'Contraseña',first?'new-password':'current-password')+
    (first?pwField('lg-pass2','Repite la contraseña','new-password')+'<p class="hint">Mínimo 8 caracteres.</p>':'')+
    (msg?'<div class="'+(ok?'okmsg':'err')+'" role="alert">'+esc(msg)+'</div>':'')+
    '<button class="btn primary" type="submit" id="lg-btn">'+(first?'Crear y entrar':'Entrar')+'</button></form></div></div>';
  const f=$(email?'lg-pass':'lg-email'); if(f) f.focus();
}
async function doLogin(f){
  const email=$('lg-email').value.trim().toLowerCase(), password=$('lg-pass').value, btn=$('lg-btn'), first=loginMode==='new';
  if(!/^\S+@\S+\.\S+$/.test(email)) return showLogin('Escribe un correo válido.',email);
  if(first){
    const p2=$('lg-pass2').value;
    if(password.length<8) return showLogin('La contraseña debe tener mínimo 8 caracteres.',email);
    if(password!==p2) return showLogin('Las dos contraseñas no coinciden.',email);
  } else if(!password) return showLogin('Escribe tu contraseña.',email);
  btn.disabled=true; btn.textContent=first?'Creando…':'Entrando…';
  let res;
  try{ res=first?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password}); }catch(e){ res={error:{message:'network'}}; }
  const {data,error}=res;
  if(error){
    const m=String(error.message||''), st=error.status;
    let t='No se pudo '+(first?'crear la cuenta':'entrar')+'. Intenta de nuevo.';
    if(/network|fetch/i.test(m)) t='No hay conexión. Revisa tu internet e intenta de nuevo.';
    else if(first&&/already|registered|exists/i.test(m)) { loginMode='in'; return showLogin('Ese correo ya tiene contraseña. Entra con ella.',email); }
    else if(first&&(st===500||/database|saving new user|autorizado/i.test(m))) t='Ese correo no está en la lista del equipo. Pídele a Rafael que lo agregue.';
    else if(first&&/password/i.test(m)) t='Esa contraseña es muy débil. Usa una más larga.';
    else if(!first&&/invalid/i.test(m)) t='Correo o contraseña incorrectos. Si es tu primera vez, entra por "Primera vez".';
    else if(/rate|too many/i.test(m)) t='Demasiados intentos. Espera un minuto e intenta de nuevo.';
    return showLogin(t,email);
  }
  if(!data.session){ loginMode='in'; return showLogin('Cuenta creada. Ahora entra con tu contraseña.',email,true); }
  USER=data.user||data.session.user; startApp();
}
function showSetup(){
  $('main').innerHTML='<div class="login"><form><div class="eyebrow">Falta un paso</div><h2>Conecta Supabase</h2><p>Abre el archivo <code>config.js</code> y pega la Project URL y la anon key de tu proyecto de Supabase.</p></form></div>';
}

async function boot(){
  if(!window.supabase||!CFG.supabaseUrl||/PEGA_AQUI/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)) return showSetup();
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  USER=session.user; startApp();
}
boot();

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window.__bip=e; const b=$('install'); if(b) b.hidden=false; });
window.addEventListener('appinstalled',()=>{ const b=$('install'); if(b) b.hidden=true; });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
